<dialog id="dialog" wiy:oncancel="this.close" wiy:onclick="this.onDialogClick">
    <div id="head">
        <div id="title">{{this.title || this.attr('title') || ''}}</div>
        <wiy-link no-href wiy:onclick="this.close">
            <wiy-icon name="close"></wiy-icon>
        </wiy-link>
    </div>
    <div id="content">
        <slot></slot>
    </div>
    <wiy-back-top wiy:data-container="this.getElement('content')"></wiy-back-top>
</dialog>
