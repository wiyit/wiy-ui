<input id="checkbox" type="checkbox" wiy:data="this.checked" wiy:onchange="this.onInputChange" />
<template wiy:let-label="this.attr('label')" wiy:let-is-slot-assigned="this.isSlotAssigned()">
    <label for="checkbox" wiy:if="!isSlotAssigned && label">{{label}}</label>
    <label for="checkbox" wiy:if="isSlotAssigned">
        <slot></slot>
    </label>
</template>
